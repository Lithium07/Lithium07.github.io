# ---------------------------------------------------------------
# 构建设置（一般不用改）
# ---------------------------------------------------------------
# 必须显式关掉主题。GitHub Pages 默认会套用 jekyll-theme-primer，
# 而它自带的 assets/css/style.scss 会编译成 assets/css/style.css，
# 和本站自己的样式表撞路径、把它覆盖掉（页面会变成没有样式的裸 HTML）。
# 本站布局和样式都是手写的，不需要任何主题。
theme:

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: true       # 换行即断行 —— publications.md 里每条 3 行的写法靠它生效
  syntax_highlighter: rouge

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - assets/img/README.md
  - vendor
  - .bundle
  - .jekyll-cache
